name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег, например v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Проверки
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go vet ./...
          go test -race ./...
          GOARCH=386 CGO_ENABLED=0 go test ./...
          node --test internal/web/static/*.test.js
      - name: Собрать бинарники
        run: |
          make dist VERSION="$RELEASE_TAG"
          test "$(dist/ctf-proxyutils-linux-amd64 -version)" = "ctf-proxyutils $RELEASE_TAG"
          cd dist && sha256sum -c checksums.txt
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "CTF-ProxyUtils $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
