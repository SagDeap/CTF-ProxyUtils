<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">CTF-ProxyUtils: трафик и управление</title>
  <desc id="desc">Чекер и атакующие подключаются к vulnbox. Прокси направляет новые соединения на основной или резервный сервис. Команда открывает панель через SSH-туннель.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#47d997"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6cb6ff"/></marker>
  </defs>
  <rect width="1120" height="360" rx="16" fill="#0d1117"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="32" y="38" fill="#97a6b7" font-size="13" letter-spacing="2">ТРАФИК СЕРВИСА</text>
    <rect x="32" y="86" width="216" height="108" rx="12" fill="#161b22" stroke="#303b49"/>
    <text x="56" y="124" fill="#e6edf3" font-size="20" font-weight="600">Чекер / атакующие</text>
    <text x="56" y="157" fill="#97a6b7" font-size="15">TCP → vulnbox:7010</text>
    <path d="M248 140H356" fill="none" stroke="#47d997" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="368" y="70" width="310" height="140" rx="12" fill="#10281f" stroke="#47d997"/>
    <text x="392" y="105" fill="#97a6b7" font-size="14">VULNBOX</text>
    <text x="392" y="137" fill="#e6edf3" font-size="22" font-weight="600">CTF-ProxyUtils :7010</text>
    <text x="392" y="178" fill="#9ce8c4" font-size="15">Запись · поиск · события · графики</text>
    <path d="M678 114H752V99H820" fill="none" stroke="#47d997" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M678 166H752V201H820" fill="none" stroke="#47d997" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <rect x="832" y="55" width="256" height="86" rx="12" fill="#161b22" stroke="#303b49"/>
    <text x="852" y="90" fill="#e6edf3" font-size="18" font-weight="600">Основной сервис</text>
    <text x="852" y="117" fill="#97a6b7" font-size="15">Ноутбук / сервер команды</text>
    <rect x="832" y="159" width="256" height="86" rx="12" fill="#161b22" stroke="#303b49"/>
    <text x="852" y="194" fill="#e6edf3" font-size="18" font-weight="600">Резервный сервис</text>
    <text x="852" y="221" fill="#97a6b7" font-size="15">Автоматика или ручной выбор</text>
    <path d="M32 265H1088" stroke="#273240"/>
    <text x="32" y="309" fill="#6cb6ff" font-size="17" font-weight="600">Браузер команды</text>
    <path d="M217 303H393" stroke="#6cb6ff" stroke-width="2" marker-end="url(#blue)"/>
    <text x="246" y="291" fill="#97a6b7" font-size="12">SSH-туннель</text>
    <text x="411" y="309" fill="#e6edf3" font-size="17">Панель 127.0.0.1:8420</text>
    <text x="800" y="309" fill="#97a6b7" font-size="14">Один бинарник · без зависимостей</text>
  </g>
</svg>
