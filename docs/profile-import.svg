<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Безопасный импорт профиля</title>
  <desc id="desc">JSON-профиль проверяется в режиме dry run, показывает изменения и после подтверждения применяет правила, детекторы и сканер.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6eb9ff"/></marker></defs>
  <rect width="1040" height="300" rx="18" fill="#0d1117"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="32" y="40" fill="#8b9bad" font-size="13" letter-spacing="2">PROFILE SCHEMA 1</text>
    <g fill="#151b23" stroke="#32404f"><rect x="32" y="82" width="194" height="132" rx="13"/><rect x="282" y="82" width="194" height="132" rx="13"/><rect x="532" y="82" width="194" height="132" rx="13"/><rect x="782" y="82" width="226" height="132" rx="13"/></g>
    <g fill="none" stroke="#6eb9ff" stroke-width="3" marker-end="url(#a)"><path d="M226 148H270"/><path d="M476 148H520"/><path d="M726 148H770"/></g>
    <g fill="#edf4f8" font-size="18" font-weight="600"><text x="56" y="121">profile.json</text><text x="306" y="121">Dry run</text><text x="556" y="121">Предпросмотр</text><text x="806" y="121">Применение</text></g>
    <g fill="#91a2b4" font-size="14"><text x="56" y="153">rules · detection</text><text x="56" y="177">scan · без token</text><text x="306" y="153">schema · порты</text><text x="306" y="177">regex · адреса</text><text x="556" y="153">+ added · ~ updated</text><text x="556" y="177">− removed</text><text x="806" y="153">merge / replace</text><text x="806" y="177">атомарная смена правил</text></g>
    <rect x="341" y="244" width="358" height="30" rx="8" fill="#102a22"/><text x="376" y="265" fill="#a9e6cc" font-size="13">Ошибка проверки → живые правила не меняются</text>
  </g>
</svg>
