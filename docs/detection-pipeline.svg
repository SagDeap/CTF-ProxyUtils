<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Конвейер анализа подозрительного трафика</title>
  <desc id="desc">Трафик проходит через неблокирующую очередь, нормализацию, детекторы и оценку риска, после чего создаётся объяснимая находка.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#55d69e"/></marker>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#16211d"/><stop offset="1" stop-color="#102a22"/></linearGradient>
  </defs>
  <rect width="1120" height="330" rx="18" fill="#0d1117"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="34" y="40" fill="#8b9bad" font-size="13" letter-spacing="2">ОБЪЯСНИМЫЙ РИСК · ASYNC</text>
    <g fill="#151b23" stroke="#32404f">
      <rect x="34" y="92" width="172" height="112" rx="13"/>
      <rect x="250" y="92" width="172" height="112" rx="13"/>
      <rect x="466" y="92" width="190" height="112" rx="13"/>
      <rect x="700" y="92" width="172" height="112" rx="13"/>
      <rect x="916" y="92" width="170" height="112" rx="13" fill="url(#g)" stroke="#55d69e"/>
    </g>
    <g fill="none" stroke="#55d69e" stroke-width="3" marker-end="url(#a)">
      <path d="M206 148H238"/><path d="M422 148H454"/><path d="M656 148H688"/><path d="M872 148H904"/>
    </g>
    <g fill="#ecf3f8" font-size="18" font-weight="600">
      <text x="58" y="126">TCP / UDP</text><text x="274" y="126">Очередь</text><text x="490" y="126">Нормализация</text><text x="724" y="126">Сигналы</text><text x="940" y="126">Находка</text>
    </g>
    <g fill="#8fa0b2" font-size="14">
      <text x="58" y="155">in / out чанки</text><text x="58" y="179">путь и payload</text>
      <text x="274" y="155">не блокирует I/O</text><text x="274" y="179">счётчик потерь</text>
      <text x="490" y="155">склейка чанков</text><text x="490" y="179">URL decode</text>
      <text x="724" y="155">встроенные + свои</text><text x="724" y="179">баллы 1…100</text>
      <text x="940" y="155">причины и фрагмент</text><text x="940" y="179">автозакрепление</text>
    </g>
    <rect x="250" y="246" width="622" height="48" rx="10" fill="#121820" stroke="#293746"/>
    <text x="278" y="276" fill="#b9c6d2" font-size="15">FLAG regex + automation + traversal + injection + burst → суммарная оценка</text>
  </g>
</svg>
